[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linguonnx"
dynamic = ["version"]
description = "CPU-first language technology models on ONNX Runtime: language identification and machine translation, with no torch at runtime"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "jarbasAi", email = "jarbasai@mailfence.com" }
]
requires-python = ">=3.9"
dependencies = [
    "onnxruntime",
    "numpy",
    "huggingface_hub",
    "langcodes",
    "sentencepiece",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
test = ["pytest", "onnx"]

[project.urls]
Homepage = "https://github.com/TigreGotico/linguonnx"

[tool.setuptools.packages.find]
include = ["linguonnx*"]

[tool.setuptools.package-data]
linguonnx = ["model_index/*.json"]

[tool.setuptools.dynamic]
version = { attr = "linguonnx.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "network: tests that download real models and need internet access",
]
