[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingonnx"
dynamic = ["version"]
description = "CPU-first language technology models on ONNX Runtime (language identification, with translation planned)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "jarbasAi", email = "jarbasai@mailfence.com" }
]
requires-python = ">=3.9"
dependencies = [
    "onnxruntime",
    "numpy",
    "huggingface_hub",
    "langcodes",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/lingonnx"

[tool.setuptools.packages.find]
include = ["lingonnx*"]

[tool.setuptools.package-data]
lingonnx = ["model_index/*.json"]

[tool.setuptools.dynamic]
version = { attr = "lingonnx.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "network: tests that download real models and need internet access",
]
